# Active when SPRING_PROFILES_ACTIVE=docker (set in docker-compose / root .env).
# All secrets and JDBC URL come from environment variables, not from this file.

spring.jpa.show-sql=false

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

app.media.root=${APP_MEDIA_ROOT:/data/media}
