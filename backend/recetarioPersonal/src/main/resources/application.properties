spring.application.name=recetario-backend

# Load secrets from application-local.properties (gitignored). See application-local.properties.example.
spring.config.import=optional:classpath:application-local.properties

spring.datasource.driver-class-name=org.postgresql.Driver
# Defaults for local dev; override entirely in application-local.properties if you prefer.
spring.datasource.url=jdbc:postgresql://localhost:5432/recetario_db
spring.datasource.username=recetario_user

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Schema is owned by Flyway migrations under classpath:db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
