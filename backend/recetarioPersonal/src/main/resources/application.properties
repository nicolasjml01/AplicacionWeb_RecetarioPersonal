spring.application.name=recetario-backend

# Load secrets from application-local.properties (gitignored). See application-local.properties.example.
spring.config.import=optional:classpath:application-local.properties

# Local dev defaults (override in application-local.properties).
spring.datasource.url=jdbc:postgresql://localhost:5432/recetario_db
spring.datasource.username=recetario_user

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway: SQL migrations under db/migration, Java migrations in the migration package.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:backend/recetarioPersonal/migration

# File upload (image / video)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# Base folder on disk: user/recipe/renamed-file
app.media.root=${user.home}/recetario-media
app.media.max-file-size-bytes=52428800