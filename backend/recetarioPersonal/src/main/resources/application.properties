spring.application.name=recetario-backend

# Default profile for IDE/`mvn spring-boot:run`. Docker sets SPRING_PROFILES_ACTIVE=docker in compose.
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:backend/recetarioPersonal/migration

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

app.media.max-file-size-bytes=52428800

app.jwt.secret=${APP_JWT_SECRET:dev-only-change-me-before-production-min-32-chars!!}
app.jwt.expiration-hours=${APP_JWT_EXPIRATION_HOURS:168}
app.jwt.cookie-name=${APP_JWT_COOKIE_NAME:recetario_auth}
app.jwt.cookie-secure=${APP_JWT_COOKIE_SECURE:false}

app.cors.allowed-origin-patterns[0]=http://localhost:*
app.cors.allowed-origin-patterns[1]=http://127.0.0.1:*
app.cors.allowed-origin-patterns[2]=http://192.168.*.*:*
app.cors.allowed-origin-patterns[3]=http://10.*.*.*:*
app.cors.allowed-origin-patterns[4]=http://172.16.*.*:*
