spring.application.name=recetario-backend

# Database H2 configuration
spring.datasource.url=jdbc:h2:file:C:/Users/Usuario/recetario
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Console H2: in the browser http://localhost:8080/h2-console to see tables and data
spring.h2.console.enabled=true
# JPA: H2 dialect, that creates/updates tables according to the entities, and shows the SQL
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

