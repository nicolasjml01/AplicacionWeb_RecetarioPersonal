spring.application.name=recetario-backend

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:backend/recetarioPersonal/migration

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

app.media.root=${APP_MEDIA_ROOT:/data/media}
app.media.max-file-size-bytes=52428800

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-hours=${APP_JWT_EXPIRATION_HOURS:168}
app.jwt.cookie-name=${APP_JWT_COOKIE_NAME:recetario_auth}
app.jwt.cookie-secure=${APP_JWT_COOKIE_SECURE:false}
